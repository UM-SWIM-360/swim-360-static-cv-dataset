# dataset_config.yaml
# Maps each swimmer ID to a split (train / valid / test).
# Hand-edit a value below + re-run compile_coco.py to move that swimmer
# between splits -- no folders need to be moved manually.
# Generated by generate_split_config.py; re-running that script will NOT
# overwrite this file unless --force is passed, so edits here are safe.

splits:
  P007: train
  P008: valid
  P011: test
  P012: test
  P014: train
